<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pilas</title>
<meta name="theme-color" content="#2E1A5C">
<meta name="description" content="Pilas: cobra y recuerda las mensualidades de tu academia. Prototipo con datos de ejemplo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pilas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Pilas · La pila de monedas">
<meta property="og:description" content="Tú enseñas. Pilas avisa. Prueba el prototipo e instálalo en tu teléfono.">
<meta property="og:image" content="https://gabrielelc02.github.io/pilas/og.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--pausa-bg:#E3EAF2;--pausa-ink:#34506E;--gris-bg:#EDECE7;--gris-ink:#5F5B53;--in-num:#1E7A4C;--out-num:#A8481A;--d-ok:#2E9E62;--d-par:#E0A93B;--d-debe:#E5484D;--d-gris:#C9CCCA;--d-pausa:#8FA9C2;--d-fut:#E2DDD2;--c-in:var(--ink);--c-out:#E8A33A;--wa-bg:#DDF3E6;--wa-ink:#14633A;--wa-btn:#1A7F45;--bg:#FFF8EC;--surface:#FFFFFF;--ink:#2E1A5C;--muted:#625880;--line:rgba(46,26,92,.10);--line-strong:rgba(46,26,92,.24);--head-bg:#2E1A5C;--head-ink:#FFF8EC;--demo-bg:#FFC53D;--demo-ink:#2E1A5C;--hero-bg:#2E1A5C;--hero-ink:#FFF8EC;--bar-bg:rgba(255,248,236,.16);--bar-fill:#FFC53D;--btn-bg:#2E1A5C;--btn-ink:#FFC53D;--tab-on:#FFEFC4;--ok-bg:#FFEDB3;--ok-ink:#553A00;--warn-bg:#FFD9BE;--warn-ink:#7A3300;--bad-bg:#FFDCD8;--bad-ink:#8A1A12;--display:'Fredoka',system-ui,sans-serif;--display-w:700;--splash-bg:#2E1A5C;--cele-bg:#2E1A5C;--cele-ink:#FFF8EC;--c-out:#FF6B4A;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent;cursor:pointer}
a{color:inherit}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.i.s{width:18px;height:18px}.i.xs{width:15px;height:15px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;min-height:100vh}
header.top{position:sticky;top:0;z-index:10;background:var(--head-bg);color:var(--head-ink);padding:calc(12px + env(safe-area-inset-top)) 18px 12px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.academy{margin-top:8px;font-size:13px;font-weight:600;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--demo-bg);color:var(--demo-ink);white-space:nowrap;border:0}
main{padding:14px 14px calc(110px + env(safe-area-inset-bottom))}
main.conpay{padding-bottom:calc(200px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block}
h1{font-family:var(--display);font-weight:var(--display-w);font-size:28px;letter-spacing:-.02em;margin:6px 4px 2px;line-height:1.12}
h2{font-family:var(--display);font-weight:var(--display-w);font-size:24px;letter-spacing:-.02em;margin:0;line-height:1.15}
.sub{margin:2px 4px 14px;color:var(--muted);font-size:14px}
.muted{color:var(--muted);font-size:14px}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px}
.sech.debe{color:var(--bad-ink)}.sech.par{color:var(--warn-ink)}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:0 0 0 1px var(--line);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
.card.flat{background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.card.list{padding:2px 4px}
.list>.row+.row{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:11px 10px;width:100%;background:none;border:0;text-align:left;min-height:64px;cursor:pointer}
.row .ic{flex:none;width:48px;display:flex;justify-content:center;align-items:center}
.row .ic svg{display:block}
.tx{flex:1;min-width:0}
.tx .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .n.fx{display:flex;align-items:center;gap:6px}.tx .n.fx .badge{margin-left:0}.tx .n.fx .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.badge{flex:none;font-size:11px;font-weight:700;margin-left:6px;padding:2px 7px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--muted);vertical-align:2px}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;flex:none;display:inline-block}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}.pill.par{background:var(--warn-bg);color:var(--warn-ink)}.pill.debe{background:var(--bad-bg);color:var(--bad-ink)}
.pill.pausa{background:var(--pausa-bg);color:var(--pausa-ink)}.pill.gris,.pill.fut{background:var(--gris-bg);color:var(--gris-ink)}
.chev{color:var(--muted);opacity:.6}
/* Inicio */
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:24px;padding:18px 18px 16px;margin-top:6px}
.hero .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.hero .big{font-family:var(--display);font-weight:var(--display-w);font-size:42px;letter-spacing:-.02em;margin:4px 0 6px;line-height:1.05}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--btn-bg);border-radius:999px;transition:width .6s}
.hero .bar{background:var(--bar-bg)}.hero .bar i{background:var(--bar-fill)}
.hero .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero .pills span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--bar-bg)}
.hero .go{margin-top:14px;width:100%;border:0;border-radius:14px;min-height:50px;font-weight:700;font-size:16px;background:var(--bar-fill);color:var(--hero-bg);display:flex;align-items:center;justify-content:center;gap:6px}
.states{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.state-pill{background:var(--surface);border:0;border-radius:18px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 0 0 1px var(--line);min-height:44px}
.state-pill svg{display:block}
.state-pill .n{font-family:var(--display);font-weight:var(--display-w);font-size:22px;line-height:1}
.state-pill .l{font-size:12px;font-weight:600;color:var(--muted);text-align:center;line-height:1.2}
.tip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:18px;padding:12px 14px;box-shadow:0 0 0 1px var(--line);margin-bottom:8px;min-height:62px}
.tip .ico{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--tab-on);color:var(--ink)}
.tip b{display:block;font-size:15px}
.tip .t{display:block;font-size:13px;color:var(--muted)}
.tip.alert{background:var(--bad-bg);color:var(--bad-ink);box-shadow:none;margin-top:12px}
.tip.alert .t{color:inherit;opacity:.85}.tip.alert .ico{background:rgba(255,255,255,.65);color:var(--bad-ink)}
.tip.ej{background:var(--demo-bg);color:var(--demo-ink);box-shadow:none}
.tip.ej .t{color:inherit;opacity:.85}.tip.ej .ico{background:rgba(255,255,255,.18);color:inherit}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.qa button{border:0;background:var(--surface);border-radius:18px;padding:14px;text-align:left;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px;min-height:100px}
.qa .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--tab-on)}
.qa b{font-size:15px;display:block}.qa small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.kpis,.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kpis .l,.mini .l{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.kpis .v{font-family:var(--display);font-weight:var(--display-w);font-size:22px;margin-top:2px}
.mini .v{font-weight:700;font-size:18px;margin-top:2px}
.vin{color:var(--in-num)}.vout{color:var(--out-num)}.vbad{color:var(--bad-ink)}
/* Controles */
.seg{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:16px;box-shadow:0 0 0 1px var(--line);margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:12px;min-height:42px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--btn-bg);color:var(--btn-ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:16px;box-shadow:inset 0 0 0 2px var(--line);padding:0 14px;margin:0 0 12px;color:var(--muted)}
.search input{flex:1;border:0;background:none;outline:none;min-height:50px;font-size:16px;color:var(--ink);min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.chip{border:0;border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line-strong);white-space:nowrap;min-height:42px;display:inline-flex;align-items:center;gap:7px}
.chip.on{background:var(--btn-bg);color:var(--btn-ink);box-shadow:none}
.chip small{opacity:.7;font-weight:700;font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:700;font-size:16px;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;text-decoration:none;background:var(--btn-bg);color:var(--btn-ink);text-align:center}
.btn.sec{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line-strong)}
.btn.warn{background:var(--bad-bg);color:var(--bad-ink)}
.btn.wa{background:var(--wa-btn);color:#fff}
.btn.sm{min-height:44px;font-size:14px;padding:10px 14px;width:auto;margin-top:0;display:inline-flex}
.ghost{border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line-strong);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:38px;white-space:nowrap}
.wab{flex:none;width:44px;height:44px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;background:var(--wa-bg);color:var(--wa-ink)}
.wab.off{background:var(--bg);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-strong)}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:16px 2px 6px}
.inp,select,textarea{width:100%;padding:13px 14px;border-radius:14px;border:0;box-shadow:inset 0 0 0 2px var(--line);background:var(--surface);font-size:16px;color:var(--ink)}
textarea{min-height:170px;resize:vertical;line-height:1.45;display:block}
select{appearance:auto;min-height:50px}
.money{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 2px var(--line);padding:0 14px}
.money span{font-weight:700;color:var(--muted)}
.money input{flex:1;border:0;outline:none;background:none;min-height:48px;font-size:18px;font-weight:700;min-width:0;width:100%}
.mrow{display:flex;align-items:center;gap:12px;margin-top:12px}
.mrow .lbl{width:100px;font-weight:700;flex:none}
.mrow .money{flex:1}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0 112px}
.hint.okc{color:var(--in-num);font-weight:600}
.pe{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:8px 0 0 112px;cursor:pointer}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--btn-bg);flex:none;margin:0}
.fam{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.fam label{display:flex;gap:10px;align-items:center;padding:9px 0;font-size:14px;cursor:pointer}
.pick{display:flex;align-items:center;gap:12px}
.sw{width:52px;height:32px;border-radius:999px;border:0;background:var(--line-strong);position:relative;flex:none;transition:background .2s;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--btn-bg)}.sw.on::after{transform:translateX(20px)}
.desc{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px;border-radius:14px;background:var(--ok-bg);color:var(--ok-ink)}
.desc .tx b{display:block;font-size:14px}.desc .tx div{font-size:13px;opacity:.85}
.tasa{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);font-size:14px}
.tasa .conv{display:flex;gap:8px;align-items:center;margin-top:10px}
.tasa .conv input{flex:1;min-width:0}
.tasa .conv b{min-width:84px;text-align:right}
.linkbtn{border:0;background:none;padding:0;font-weight:700;text-decoration:underline;font-size:inherit;color:var(--ink)}
.more{border:0;background:none;color:var(--ink);font-weight:700;font-size:14px;margin-top:14px;padding:8px 0;display:flex;align-items:center;gap:6px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px;align-items:flex-start}
.kv>b,.kv>span:last-child{text-align:right}
.kv.first{border-top:0}
.ok-big{display:flex;justify-content:center;margin:6px 0 10px}
/* Alumnos */
.dots{display:flex;gap:4px;margin-top:5px}
.dots i{width:18px;height:6px;border-radius:3px;display:block}
.c-ok{background:var(--d-ok)}.c-par{background:var(--d-par)}.c-debe{background:var(--d-debe)}.c-gris{background:var(--d-gris)}.c-pausa{background:var(--d-pausa)}.c-fut{background:var(--d-fut)}
.fhead{display:flex;gap:14px;align-items:center;margin:2px 44px 6px 0}
.fhead .ic{flex:none}
.btns3{display:grid;gap:8px;margin:14px 0 4px}
.btns3 button{border:0;border-radius:14px;min-height:66px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line-strong);padding:6px}
.btns3 .pri{background:var(--btn-bg);color:var(--btn-ink);box-shadow:none}
.btns3 .w{background:var(--wa-bg);color:var(--wa-ink);box-shadow:none}
.grid12{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid12 div{border-radius:12px;padding:8px 4px;text-align:center;font-weight:700;font-size:13px}
.grid12 small{display:block;font-size:11px;font-weight:600;margin-top:2px;opacity:.9}
.g-ok{background:var(--ok-bg);color:var(--ok-ink)}.g-par{background:var(--warn-bg);color:var(--warn-ink)}.g-debe{background:var(--bad-bg);color:var(--bad-ink)}
.g-pausa{background:var(--pausa-bg);color:var(--pausa-ink)}.g-gris{background:var(--gris-bg);color:var(--gris-ink)}.g-fut{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(86px + env(safe-area-inset-bottom));z-index:18;border:0;border-radius:999px;padding:14px 20px;background:var(--btn-bg);color:var(--btn-ink);font-weight:700;display:flex;gap:6px;align-items:center;box-shadow:0 8px 22px rgba(0,0,0,.22);min-height:54px}
/* Finanzas */
.chart{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:6px}
.chart .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.chart .bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.chart .bars i{width:12px;border-radius:4px 4px 0 0;min-height:2px;display:block}
.chart span{font-size:12px;color:var(--muted);font-weight:700}
.chart .m.on span{color:var(--ink)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:10px;justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{margin-top:12px}.hb .t{display:flex;justify-content:space-between;font-size:14px;gap:10px}
.hb .b{height:8px;border-radius:999px;background:var(--line);margin-top:5px;overflow:hidden}
.hb .b i{display:block;height:100%;background:var(--btn-bg);border-radius:999px}
.foot{text-align:center;margin:18px 10px 6px;font-size:13px;color:var(--muted)}
.empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty .e{font-size:30px;line-height:1}
.empty b{display:block;color:var(--ink);margin:8px 0 4px;font-size:16px}
.repo{background:var(--bg);border-radius:14px;padding:14px;box-shadow:inset 0 0 0 1px var(--line)}
.repo .tot{text-align:center;background:var(--surface);border-radius:12px;padding:12px;margin-bottom:6px}
.repo .tot b{display:block;font-family:var(--display);font-weight:var(--display-w);font-size:28px;color:var(--bad-ink)}
/* Barra de pago, pestañas, hoja */
.paybar{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));z-index:19;display:flex;justify-content:center;padding:0 10px 8px;pointer-events:none}
.paybar .in{pointer-events:auto;width:100%;max-width:460px;display:flex;align-items:center;gap:12px;background:var(--hero-bg);color:var(--hero-ink);border-radius:20px;padding:10px 10px 10px 18px;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.paybar .t{flex:1;min-width:0}
.paybar small{display:block;font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paybar b{display:block;font-family:var(--display);font-weight:var(--display-w);font-size:26px;line-height:1.1}
.paybar .btn{width:auto;margin:0;background:var(--bar-fill);color:var(--hero-bg);flex:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--surface);box-shadow:0 -1px 0 var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;width:100%;max-width:480px;gap:2px}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;font-size:11.5px;font-weight:700;color:var(--muted);min-height:58px;border-radius:14px}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--tab-on)}
nav.tabs .c{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--btn-bg);color:var(--btn-ink);margin-top:-18px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
nav.tabs button.plus[aria-current="page"]{background:none}
.backdrop{position:fixed;inset:0;background:rgba(10,10,20,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}

<script>

const $=id=>document.getElementById(id);
function fmt(v,dec){const s=(dec?v.toFixed(dec):String(Math.round(v))).split('.');return s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(s[1]?','+s[1]:'');}

const tarifaMes=(a,m)=>(a.precios&&a.precios[m]>0)?a.precios[m]:a.tarifa;
function estado(a,m){
  const ym=ymDe(m),pag=a.pagos[m]||0,marca=a.marcas[m],tar=tarifaMes(a,m),esp=!!(a.precios&&a.precios[m]>0);
  const r=(e,debe)=>({e,pag,debe,tar,esp});
  if(marca==='Pausa')return r('pausa',0);
  if(!a.alta||ym<a.alta)return r(pag>0?'ok':'gris',0);
  if(a.tipo!=='Mensual')return r(pag>0?'ok':'gris',0);
  if(marca==='Prorrateo'&&pag>0)return r('ok',0);
  if(tar>0&&pag>=tar)return r('ok',0);
  if(!a.activo)return r(pag>0?'ok':'gris',0);
  if(m>MES_HOY)return r('fut',0);
  if(pag>0)return r('par',r2(tar-pag));
  return r('debe',tar);
}
function cobranza(m){
  const c={esp:0,cob:0,fal:0,deb:[],par:[],ok:[]};
  D.alumnos.forEach(a=>{
    if(!a.activo||a.tipo!=='Mensual')return;
    const s=estado(a,m);
    if(s.e==='gris'||s.e==='pausa'||s.e==='fut')return;
    c.esp+=(a.marcas[m]==='Prorrateo')?s.pag:s.tar;c.cob+=s.pag;c.fal+=s.debe;
    if(s.e==='debe')c.deb.push([a,s]);else if(s.e==='par')c.par.push([a,s]);else c.ok.push([a,s]);
  });
  c.esp=r2(c.esp);c.cob=r2(c.cob);c.fal=r2(c.fal);return c;
}

const debeConDesc=(x,m)=>{const s=estado(x,m),p=AJ().descuentoPct||0;return s.debe>0?r2(Math.max(0,s.tar*(1-p/100)-s.pag)):0;};
function pieCobro(totalUsd,totalDesc){const aj=AJ();let t='';

  if(aj.datosPago)t+='\n\n*Datos para pagar:*\n'+aj.datosPago;return t;}
function mensajeCobro(a,meses){

function kpis(esp,cob,fal,txt){$('kEsp').textContent=money(esp);$('kCob').textContent=money(cob);$('kFal').textContent=money(fal);

function filtroCob(){const q=($('busCob').value||'').trim().toLowerCase();return a=>!q||a.nombre.toLowerCase().indexOf(q)>=0||(a.familia||'').toLowerCase().indexOf(q)>=0;}
function pintarAnio(){
  let esp=0,cob=0,fal=0;const lista=[],pasa=filtroCob();
  D.alumnos.forEach(a=>{
    if(!a.activo||a.tipo!=='Mensual')return;
    let debe=0;const meses=[];
    for(let m=0;m<=MES_HOY;m++){const s=estado(a,m);if(s.e==='gris'||s.e==='pausa'||s.e==='fut')continue;
      esp+=(a.marcas[m]==='Prorrateo')?s.pag:s.tar;cob+=s.pag;fal+=s.debe;if(s.debe>0){debe+=s.debe;meses.push(m);}}

  });
  kpis(esp,cob,fal,lista.length?lista.length+' alumnos con deuda en '+ANIO:'¡Todos al día!');

    .sort((x,y)=>(y.activo-x.activo)||x.nombre.localeCompare(y.nombre)).slice(0,10);

function elegirAlumno(n,meses){
  const a=buscar(n);if(!a)return;
  reg=nuevoReg();reg.al=a;
  if(meses&&meses.length)reg.meses=meses.slice();
  else{let m=MES_HOY;for(let k=Math.max(0,MES_HOY-2);k<=MES_HOY;k++){const s=estado(a,k);if(s.e==='debe'||s.e==='par'){m=k;break;}}reg.meses=[m];}

const descAplica=()=>{const aj=AJ();return aj.descuentoPct>0&&!!reg.metodo&&aj.descuentoMetodos.indexOf(reg.metodo)>=0&&reg.concepto==='Mensualidad';};
const descOn=()=>descAplica()&&reg.desc;
function sugMonto(a,m){const s=estado(a,m);if(descOn())return r2(Math.max(0,s.tar*(1-AJ().descuentoPct/100)-s.pag));return s.e==='par'?s.debe:s.tar;}
const mesesOrden=()=>reg.meses.slice().sort((x,y)=>x-y);
function hermanosItems(){
  const a=reg.al;if(!a||!a.familia)return [];
  return grupoDe(a).filter(x=>x!==a).map(x=>{
    const items=mesesOrden().filter(m=>estado(x,m).e!=='ok'&&estado(x,m).e!=='pausa').map(m=>({alumno:x.nombre,ym:ymDe(m),m,monto:sugMonto(x,m)}));
    let on=reg.hermanos[x.nombre];if(on===undefined)on=items.length>0;
    return {a:x,items,on:on&&items.length>0};
  });
}
function itemsPago(){
  const a=reg.al,dOn=descOn(),pct=AJ().descuentoPct;
  const marcar=(x,al)=>{const pag=estado(al,x.m).pag||0;
    if(dOn){x.precio=r2(pag+x.monto);x.motivo='Descuento '+pct+'% por pago en '+reg.metodo;}
    else if(al===a&&reg.especial[x.m])x.precio=r2(pag+x.monto);
    return x;};
  let it=mesesOrden().map(m=>marcar({alumno:a.nombre,ym:ymDe(m),m,monto:reg.montos[m]||0},a));
  hermanosItems().forEach(h=>{if(h.on)it=it.concat(h.items.map(x=>marcar({alumno:x.alumno,ym:x.ym,m:x.m,monto:x.monto},h.a)));});
  return it;
}

function pintarTotal(){
  if(!reg.al)return;

function convertirPago(v){

function togMes(m){const i=reg.meses.indexOf(m);if(i>=0){if(reg.meses.length>1)reg.meses.splice(i,1);}else reg.meses.push(m);pintarReg();}
function confirmarPago(){

  const it=itemsPago();

${it.map(x=>`<div class="kv"><span>${esc(x.alumno)} · ${MESL[x.m]}${x.precio?`<br><span class="muted">${x.motivo?'Con descuento: el mes queda en ':'Precio especial del mes: '}${money(x.precio)}</span>`:''}</span><b class="num">${money(x.monto)}</b></div>`).join('')}

<button class="btn" data-act="guardar-pago">${ic('check','s')}Sí, guardar</button><button class="btn sec" data-act="cerrar">Volver</button>`);

// Revisión de pagos repetidos (misma regla que la app madre): solo mensualidades;
// avisa si con este pago se pasaría de lo que le toca o si ya hay un pago por el mismo monto.
function revisarDuplicados(items,concepto){
  if((concepto||'Mensualidad')!=='Mensualidad')return [];
  const out=[];
  items.forEach(x=>{
    const prev=S.ingresos.filter(r=>r.alumno===x.alumno&&r.ym===x.ym&&r.concepto==='Mensualidad'&&r.monto>0);
    if(!prev.length)return;
    const pagado=r2(prev.reduce((s,e)=>s+e.monto,0)),nuevo=x.monto;
    const pe=S.precios[x.alumno+'|'+x.ym],al=buscar(x.alumno);
    const tarifa=x.precio>0?x.precio:(pe?pe.precio:(al?al.tarifa:0));
    const sobrepago=tarifa>0&&pagado+nuevo>tarifa+0.009,igual=prev.some(e=>Math.abs(e.monto-nuevo)<0.01);
    if(sobrepago||igual)out.push({alumno:x.alumno,m:x.m,tarifa,pagado,nuevo,pagos:prev.slice(-3)});
  });
  return out;
}
function guardarPago(forzar){
  const it=pendienteDup?pendienteDup.it:itemsPago(),bs=isBs(reg.metodo);
  const p=pendienteDup?pendienteDup.p:{concepto:reg.concepto,metodo:reg.metodo,fecha:reg.fecha,nota:reg.nota,tasa:bs&&D.tasa?D.tasa.valor:''};
  if(!forzar){const dups=revisarDuplicados(it,p.concepto);if(dups.length){pendienteDup={p,it};mostrarDuplicados(dups);return;}}
  pendienteDup=null;
  const repId=reg.reporteId;
  const ids=[],prevPrecios=[];
  it.forEach(x=>{
    const r={id:++S.seq,fecha:p.fecha,alumno:x.alumno,concepto:p.concepto,metodo:p.metodo,monto:x.monto,ym:x.ym,nota:p.nota,bs:p.tasa?r2(x.monto*p.tasa):'',tasa:p.tasa,por:AJ().usuario||'Tú'};
    S.ingresos.push(r);ids.push(r.id);
    if(x.precio>0){const k=x.alumno+'|'+x.ym;prevPrecios.push([k,S.precios[k]||null]);S.precios[k]={precio:x.precio,motivo:x.motivo||'Fijado al registrar el pago'};}
  });
  guardar();
  ultimo={ids,prevPrecios,items:it,metodo:p.metodo,concepto:p.concepto,fecha:p.fecha,tasa:p.tasa,recibo:ids[0],alumnos:it.map(x=>x.alumno).filter((v,i,s)=>s.indexOf(v)===i)};
  if(repId){const rp=S.reportes.find(x=>x.id===repId);if(rp)rp.estado='aprobado';ultimo.reporteId=repId;guardar();}
  reg=nuevoReg();refrescar();ir('ini');mostrarGuardado();
}
function mostrarDuplicados(dups){
  abrir(`<h2 id="sheetTitle">¿Pago repetido?</h2><div class="muted" style="margin:6px 0 12px">Ya hay pagos registrados para ${dups.length>1?'estos meses':'este mes'}. Puede que tu socio ya lo haya cargado.</div>

function deshacerUltimo(){
  const u=ultimo;if(!u)return;
  S.ingresos=S.ingresos.filter(r=>u.ids.indexOf(r.id)<0);
  u.prevPrecios.slice().reverse().forEach(([k,v])=>{if(v)S.precios[k]=v;else delete S.precios[k];});

function crearAlumno(){
  const n=$('nvNom').value.trim().replace(/\s+/g,' '),t=num($('nvTar').value),m=$('nvMes').value,wa=$('nvWa').value.trim(),fam=$('nvFam').value.trim().replace(/\s+/g,' ');
  if(!n){err('Escribe el nombre');return;}
  if(!(t>0)){err('Escribe la mensualidad');return;}
  if(wa&&waNum(wa).length<10){err('Revisa el número de WhatsApp');return;}
  if(S.alumnos.some(a=>a.nombre.toLowerCase()===n.toLowerCase())){err('Ya existe un alumno con ese nombre.');return;}
  S.alumnos.push({nombre:n,tarifa:t,activo:true,tipo:'Mensual',alta:m,whatsapp:wa,familia:fam});
  guardar();cerrar();filtroAlu='act';refrescar();ir('alu');toast('✓ '+n+' agregado');
}

function repartir(a,monto){let r=monto;const items=[];for(const i of deudaFamilia(a)){if(r<=0.009)break;const x=Math.min(i.debe,r);items.push({alumno:i.alumno,m:i.m,ym:ymDe(i.m),monto:r2(x)});r=r2(r-x);}return {items,sobra:r2(Math.max(0,r))};}

function leerImagen(file,cb){
  const fr=new FileReader();
  fr.onerror=()=>cb(null);
  fr.onload=()=>{const url=fr.result,img=new Image();
    img.onerror=()=>cb(null);
    img.onload=()=>{try{const max=900,k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.72));}catch(e){cb(String(url).length<1500000?url:null);}};
    img.src=url;};
  fr.readAsDataURL(file);
}
function enviarReporte(){
  leerRep();const a=rep.a,v=num(rep.monto),t=D.tasa?D.tasa.valor:0;
  if(!(v>0)){err('Escribe el monto que pagaste');return;}
  if(!rep.img&&!rep.ref.trim()){err('Adjunta el comprobante o escribe la referencia');return;}
  if(rep.moneda==='Bs'&&!t){err('La academia no tiene tasa cargada hoy: reporta el monto en dólares');return;}
  const d=new Date();
  const r={id:++S.seq,key:famKey(a),nombre:famNombre(a),alumnos:grupoDe(a).map(x=>x.nombre),fecha:HOY+'T'+pad(d.getHours())+':'+pad(d.getMinutes()),monto:v,moneda:rep.moneda,montoUsd:rep.moneda==='Bs'?r2(v/t):v,metodo:rep.metodo,ref:rep.ref.trim(),img:rep.img,estado:'pendiente',motivo:''};
  S.reportes.push(r);
  S.reportes.forEach((x,i)=>{if(x.estado!=='pendiente'&&i<S.reportes.length-10)x.img=null;});
  if(!guardar()){r.img=null;guardar();toast('La imagen era muy pesada para este teléfono de prueba: se guardó sin la imagen');}
  rep.enviado=true;rep.img=null;rep.ref='';rep.monto='';refrescar();pintarRep();
}
// ---------- Bandeja "Por confirmar" (lo que ve el dueño) ----------
function tarjetaReporte(r){
  return `<div class="rcard">${r.img?`<button class="thumb" data-act="rep-img" data-id="${r.id}" aria-label="Ver comprobante de ${esc(r.nombre)}"><img src="${r.img}" alt=""></button>`:`<span class="thumb" style="display:flex;align-items:center;justify-content:center;color:var(--muted)">${ic('doc')}</span>`}
<div class="tx"><div class="n">${esc(r.nombre)}</div><div class="s">${r.moneda==='Bs'?moneyBs(r.monto)+' ≈ '+money(r.montoUsd):money(r.monto)} · ${esc(r.metodo)}</div><div class="s">${horaRep(r.fecha)}${r.ref?' · ref '+esc(r.ref):''}</div>
<div class="rbtns"><button class="ok" data-act="rep-aprobar" data-id="${r.id}">Aprobar</button><button class="no" data-act="rep-rechazar" data-id="${r.id}">Rechazar</button></div></div></div>`;
}
function pintarBandeja(){const l=pendientes();$('bandeja').innerHTML=l.length?`<div class="sech" style="margin-top:6px"><span>Por confirmar · ${l.length}</span></div><div class="card list" style="padding:0 4px">${l.map(tarjetaReporte).join('')}</div>`:'';}
function verImagen(id){const r=S.reportes.find(x=>x.id===id);if(!r||!r.img)return;abrir(`<h2 id="sheetTitle">Comprobante · ${esc(r.nombre)}</h2><img class="full" src="${r.img}" alt="Comprobante de ${esc(r.nombre)}"><button class="btn sec" data-act="${r.estado==='pendiente'?'rep-aprobar':'cerrar'}" data-id="${r.id}">${r.estado==='pendiente'?'Aprobar o rechazar':'Cerrar'}</button>`);}
function alumnoDe(r){for(const n of r.alumnos){const a=buscar(n);if(a)return a;}return null;}
function abrirAprobar(id){
  const r=S.reportes.find(x=>x.id===id);if(!r)return;const a=alumnoDe(r);if(!a){err('Esa familia ya no está en Pilas');return;}
  const p=repartir(a,r.montoUsd);
  abrir(`<h2 id="sheetTitle">Aprobar pago</h2><div class="muted" style="margin-top:4px">${esc(r.nombre)} · ${horaRep(r.fecha)}</div>
${r.img?`<img class="full lim" src="${r.img}" alt="Comprobante de ${esc(r.nombre)}" data-act="rep-img" data-id="${r.id}">`:''}
<div class="card"><div class="kv first"><span>Reportó</span><b class="num">${r.moneda==='Bs'?moneyBs(r.monto)+'<br><span class="muted">≈ '+money(r.montoUsd)+'</span>':money(r.monto)}</b></div><div class="kv"><span>Método</span><b>${esc(r.metodo)}</b></div>${r.ref?`<div class="kv"><span>Referencia</span><b>${esc(r.ref)}</b></div>`:''}</div>
${p.items.length?`<label class="f">Se anota así</label><div class="card">${p.items.map((x,k)=>`<div class="kv${k?'':' first'}"><span>${esc(x.alumno)} · ${MESL[x.m]}</span><b class="num">${money(x.monto)}</b></div>`).join('')}${p.sobra?`<div class="muted" style="margin-top:8px">Sobran ${money(p.sobra)} que no cubren ninguna deuda: ajústalo antes de anotar.</div>`:''}</div>
<p class="muted">Antes de aprobar, revisa en tu banco que el pago llegó.</p>
<button class="btn" data-act="rep-ok" data-id="${r.id}">${ic('check','s')}Aprobar y anotar</button>`:`<div class="card"><b>Esta familia no tiene deudas pendientes.</b><div class="muted">Puede ser un pago repetido o un adelanto. Ajústalo en Registrar o recházalo.</div></div>`}
<button class="btn sec" data-act="rep-ajustar" data-id="${r.id}">Ajustar antes de anotar</button><button class="btn warn" data-act="rep-rechazar" data-id="${r.id}">Rechazar</button>`);
}
function aprobarReporte(id){
  const r=S.reportes.find(x=>x.id===id);if(!r)return;const a=alumnoDe(r);if(!a)return;
  const p=repartir(a,r.montoUsd);if(!p.items.length)return;
  const tasa=r.moneda==='Bs'&&r.montoUsd?r2(r.monto/r.montoUsd):'',ids=[];
  p.items.forEach(x=>{const ing={id:++S.seq,fecha:HOY,alumno:x.alumno,concepto:'Mensualidad',metodo:r.metodo,monto:x.monto,ym:x.ym,nota:'Comprobante enviado por el representante'+(r.ref?' · ref '+r.ref:''),bs:tasa?r2(x.monto*tasa):'',tasa,por:'Link de la familia'};S.ingresos.push(ing);ids.push(ing.id);});
  r.estado='aprobado';guardar();
  ultimo={ids,prevPrecios:[],items:p.items,metodo:r.metodo,concepto:'Mensualidad',fecha:HOY,tasa,recibo:ids[0],alumnos:p.items.map(x=>x.alumno).filter((v,i,s)=>s.indexOf(v)===i),reporteId:id};
  refrescar();mostrarGuardado();
}
function ajustarReporte(id){
  const r=S.reportes.find(x=>x.id===id);if(!r)return;const a=alumnoDe(r);if(!a)return;
  const p=repartir(a,r.montoUsd),quien=p.items.length?p.items[0].alumno:a.nombre,propios=p.items.filter(x=>x.alumno===quien);
  cerrar();elegirAlumno(quien,propios.length?propios.map(x=>x.m):null);
  reg.reporteId=id;reg.metodo=r.metodo;reg.nota='Comprobante enviado por el representante'+(r.ref?' · ref '+r.ref:'');
  propios.forEach(x=>{reg.montos[x.m]=x.monto;});
  pintarReg();ir('reg');toast('Ajusta meses y montos, y guarda el pago');
}
let rechazo={id:0,motivo:''};
const MOTIVOS=['No llegó al banco','El monto no coincide','No se ve el comprobante','Otro motivo'];
function abrirRechazo(id,keep){
  const r=S.reportes.find(x=>x.id===id);if(!r)return;if(rechazo.id!==id)rechazo={id,motivo:''};
  abrir(`<h2 id="sheetTitle">Rechazar comprobante</h2><div class="muted" style="margin-top:4px">${esc(r.nombre)} · ${montoRep(r)}</div>
<label class="f">¿Por qué?</label><div class="chips">${MOTIVOS.map(x=>`<button class="chip${x===rechazo.motivo?' on':''}" data-act="rep-motivo" data-v="${esc(x)}" aria-pressed="${x===rechazo.motivo}">${esc(x)}</button>`).join('')}</div>
<p class="muted" style="margin-top:14px">La familia verá el motivo en su link y te queda el mensaje listo para avisarle por WhatsApp.</p>
<button class="btn warn" data-act="rep-no" data-id="${r.id}">Rechazar y avisar</button><button class="btn sec" data-act="rep-aprobar" data-id="${r.id}">Volver</button>`,keep);
}
function rechazarReporte(id){
  const r=S.reportes.find(x=>x.id===id);if(!r)return;
  if(!rechazo.motivo){err('Elige el motivo');return;}
  r.estado='rechazado';r.motivo=rechazo.motivo;guardar();refrescar();
  const a=alumnoDe(r),tel=a?telDe(grupoDe(a)):'';
  const msg='Hola 👋 Te escribimos de *'+ACAD()+'* '+EMO()+'\n\nNo pudimos confirmar tu pago de '+montoRep(r)+' ('+r.motivo.toLowerCase()+').\n\n¿Nos ayudas revisándolo y enviando el comprobante de nuevo? ¡Gracias!';
  abrirMensaje('Avisar a la familia',esc(r.nombre)+' · comprobante rechazado',msg,tel);

<p class="muted">Lo que registres se guarda solo en tu teléfono. Son datos de ejemplo: prueba sin miedo.</p>`);

// ---------- Eventos ----------

  const t=e.target.closest('[data-tab]');if(t){ir(t.dataset.tab);return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const k=el.dataset.act,n=el.dataset.n,m=el.dataset.m!==undefined?parseInt(el.dataset.m,10):undefined,v=el.dataset.v;
  switch(k){
    case 'cerrar':cerrar();break;
    case 'toast-btn':if(toastFn)toastFn();break;
    case 'ir-cob':mesSel=m;pintarSeg();pintarPend();ir('cob');break;
    case 'ir-alu':filtroAlu='act';pintarAlumnos();ir('alu');break;
    case 'ir-reg':cerrar();ir('reg');break;
    case 'ir-fin':resSel=m;pintarResumen();ir('fin');break;
    case 'sinwa':filtroAlu='sinwa';pintarAlumnos();ir('alu');break;

    case 'guardar-tasa':guardarTasa();break;
    case 'seg':mesSel=m;pintarSeg();pintarPend();break;
    case 'cobrar':cobrar(n,(el.dataset.ms||'').split(',').filter(x=>x!=='').map(Number));break;
    case 'wa':recordar(n,false);break;
    case 'wa-anio':recordar(n,true);break;
    case 'novino':noVino(n,m);break;
    case 'elegir':elegirAlumno(n);break;
    case 'cambiar':reg=nuevoReg();pintarReg();setTimeout(()=>$('busAl').focus(),30);break;
    case 'mes':togMes(m);break;
    case 'metodo':{const antes=descOn();reg.metodo=v;if(descOn()!==antes)reg.montos={};pintarReg();break;}
    case 'concepto':{const antes=descOn();reg.concepto=v;if(descOn()!==antes)reg.montos={};pintarReg();break;}
    case 'desc':reg.desc=!reg.desc;reg.montos={};pintarReg();break;
    case 'mas':reg.mas=!reg.mas;pintarReg();break;

    case 'guardar-pago':pendienteDup=null;guardarPago(false);break;

    case 'recibo':enviarRecibo();break;
    case 'deshacer-pago':deshacerUltimo();break;
    case 'filtro':filtroAlu=el.dataset.f;pintarAlumnos();break;

    case 'marcar':marcar(n,el.dataset.tipo);break;

    case 'quitar-precio':quitarPrecio(n,m);break;

    case 'rep-aprobar':abrirAprobar(+el.dataset.id);break;
    case 'rep-ok':aprobarReporte(+el.dataset.id);break;

    case 'rep-rechazar':abrirRechazo(+el.dataset.id);break;
    case 'rep-motivo':rechazo.motivo=v;abrirRechazo(rechazo.id,true);break;
    case 'rep-no':rechazarReporte(+el.dataset.id);break;

  }

backdrop.addEventListener('click',cerrar);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheet.classList.contains('on')){cerrar();return;}
  if(e.key==='Escape'&&$('rep').classList.contains('on')){cerrarRep();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.dataset.act){e.preventDefault();e.target.click();}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='busCob')pintarPend();
  else if(t.id==='busLista')pintarAlumnos();
  else if(t.id==='busAl')sugerir();
  else if(t.dataset&&t.dataset.mto!==undefined){reg.montos[t.dataset.mto]=num(t.value);pintarTotal();}
  else if(t.id==='conv')convertirPago(t.value);
  else if(t.id==='gConv'){const bs=num(t.value),usd=D.tasa?r2(bs/D.tasa.valor):0;$('gConvOut').textContent=bs?'= '+money(usd):'';if(bs)$('gMonto').value=coma(usd);}
  else if(t.id==='regFecha')reg.fecha=t.value;
  else if(t.id==='regNota')reg.nota=t.value;
  else if(t.id==='repMonto')actualizarEq();
  else if(t.id==='waTxt'){const a=$('waLink');if(a)a.href=waHref(a.dataset.tel,t.value);}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='repFile'&&t.files&&t.files[0]){leerRep();leerImagen(t.files[0],url=>{if(!url){err('No pude leer esa imagen. Prueba con otra captura.');return;}rep.img=url;pintarRep(true);});return;}
  if(t.dataset&&t.dataset.esp!==undefined){reg.especial[t.dataset.esp]=t.checked;pintarTotal();}
  else if(t.dataset&&t.dataset.her!==undefined){reg.hermanos[t.dataset.her]=t.checked;pintarTotal();}
  else if(t.id==='regFecha')reg.fecha=t.value;
  else if(t.id==='avFecha'){aviso.fecha=t.value||aviso.fecha;pintarAviso(true,true);}
});
